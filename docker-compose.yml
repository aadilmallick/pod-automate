services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pod_automator
      POSTGRES_USER: pod
      POSTGRES_PASSWORD: pod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pod -d pod_automator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file: .env
    environment:
      NODE_ENV: development
      AUTH_MODE: ${AUTH_MODE:-google}
      HOST: 0.0.0.0
      PORT: 3000
      API_PUBLIC_PORT: ${API_PUBLIC_PORT:-3000}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      DATABASE_URL: postgres://pod:pod@postgres:5432/pod_automator
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${API_PUBLIC_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file: .env
    environment:
      NODE_ENV: development
      AUTH_MODE: ${AUTH_MODE:-google}
      HOST: 0.0.0.0
      PORT: 3000
      API_PUBLIC_PORT: ${API_PUBLIC_PORT:-3000}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      DATABASE_URL: postgres://pod:pod@postgres:5432/pod_automator
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
